<!-- brainup-startup:start -->
<style id="brainup-loading-style">#brainup-loading{position:fixed;inset:0;z-index:2147483647;background:#050705;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#b9d4a8;font:700 12px Montserrat,Arial,sans-serif}#brainup-loading img{width:min(300px,65vw);height:auto;max-height:118px;object-fit:contain}#brainup-loading .loading-track{width:min(240px,58vw);height:5px;overflow:hidden;border-radius:99px;background:#23301c}#brainup-loading .loading-track span{display:block;width:35%;height:100%;border-radius:inherit;background:#a3f16d;animation:brainup-loading-slide 1.2s ease-in-out infinite}#brainup-loading p{margin:0;font-size:12px;letter-spacing:.03em}@keyframes brainup-loading-slide{from{transform:translateX(-110%)}to{transform:translateX(390%)}}@media(prefers-reduced-motion:reduce){#brainup-loading .loading-track span{animation:none;width:100%;opacity:.7}}</style>
<div id="brainup-loading" role="status" aria-live="polite" aria-label="Загрузка BrainUp"><img src="{{WORDMARK_URL}}" alt="BrainUp" fetchpriority="high"><div class="loading-track" aria-hidden="true"><span></span></div><p>Загрузка…</p></div>
<script>window.brainupLoadingTimer=setTimeout(function(){var el=document.getElementById('brainup-loading');if(el)el.remove()},12000);</script>
<!-- brainup-startup:end -->
